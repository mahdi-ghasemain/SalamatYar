services:
  web:
    build:
      context: .
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:?Set the Supabase URL}
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the public publishable key}
        EXPO_PUBLIC_NEARBY_FUNCTION: ${EXPO_PUBLIC_NEARBY_FUNCTION:-nearby}
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
